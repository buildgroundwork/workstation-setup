# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Rebind resurrect save from Ctrl-s to Alt-s. The default Ctrl-b Ctrl-s is too
# easy to trigger accidentally when quickly typing Ctrl-b s (session chooser),
# and saving sessions is slow and non-interruptible.
set -g @resurrect-save 'M-s'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-pain-control'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'

set -g status-left "#{prefix_highlight}"
set -g status-right "#(cut -c1-60 /tmp/pianobar_nowplaying 2>/dev/null) | #{session_name} |#{cpu_bg_color} CPU: #{cpu_icon} #{cpu_percentage} #[bg=default]| %a %Y-%m-%d %H:%M"
set -g status-right-length 150

# Pianobar controls: Ctrl-b P <key>
bind P switch-client -T pianobar
bind -T pianobar p run-shell "~/.config/pianobar/toggle"
bind -T pianobar P run-shell "~/.config/pianobar/toggle"
bind -T pianobar n run-shell "echo 'n' > ~/.config/pianobar/ctl"
bind -T pianobar + run-shell "echo '+' > ~/.config/pianobar/ctl"
bind -T pianobar - run-shell "echo '-' > ~/.config/pianobar/ctl"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'

# Prevent automatic resizing of tmux windows
set -g window-size smallest

# Send Shift-Enter properly
bind-key -n S-Enter send-keys Escape "[13;2u"
set -s extended-keys on
set -as terminal-features 'xterm-256color:extkeys'

# Make Escape (and Ctrl-[) exit copy-mode instead of just clearing selection
bind-key -T copy-mode-vi Escape send-keys -X cancel
