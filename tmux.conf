# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Rebind resurrect save from Ctrl-s to Alt-s. The default Ctrl-b Ctrl-s is too
# easy to trigger accidentally when quickly typing Ctrl-b s (session chooser),
# and saving sessions is slow and non-interruptible.
set -g @resurrect-save 'M-s'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-pain-control'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'

set -g status-left "#{prefix_highlight}"
set -g status-right "#(~/.workstation/claude/skills/istatus/scripts/istatus-status.sh) #{session_name} |#{cpu_bg_color} CPU: #{cpu_icon} #{cpu_percentage} #[bg=default]| %a %Y-%m-%d %H:%M"
set -g status-right-length 150

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'

# Prevent automatic resizing of tmux windows
set -g window-size smallest

# Send Shift-Enter properly
bind-key -n S-Enter send-keys Escape "[13;2u"
set -s extended-keys on
set -as terminal-features 'xterm-256color:extkeys'

# Make Escape (and Ctrl-[) exit copy-mode instead of just clearing selection
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Claude session chord: prefix + A enters the "claude" key-table, then:
#   A -> istatus popup (the Claude sessions that need you or are being watched)
#   C -> clear this pane's blocking items (manual; a user Esc-interrupt of a
#        permission prompt fires no hook, so the blocked state can linger)
#   D -> hub dashboard (toggle the pinned status pane)
#   S -> istatus status pane (show or hide this window's floating status pane,
#        collapsed to a one-row bar of counts)
#   E -> expand the status pane to the full list, or collapse it again
#   F -> move the keyboard into the status pane, or back to Claude
# So the full chords are: Ctrl-b A A, Ctrl-b A C, Ctrl-b A D, Ctrl-b A S,
# Ctrl-b A E and Ctrl-b A F.
bind-key A switch-client -T claude
bind-key -T claude A run-shell "~/.workstation/claude/skills/istatus/scripts/istatus-popup.sh"
bind-key -T claude C run-shell "~/.workstation/claude/skills/istatus/scripts/istatus-hook.sh clear-pane #{pane_id}"
bind-key -T claude D run-shell "~/.claude/skills/hub/scripts/hub-status-pane.sh toggle"
bind-key -T claude S run-shell "~/.workstation/claude/skills/istatus/scripts/istatus-float.sh toggle #{pane_id}"
bind-key -T claude E run-shell "~/.workstation/claude/skills/istatus/scripts/istatus-float.sh expand #{pane_id}"
bind-key -T claude F run-shell "~/.workstation/claude/skills/istatus/scripts/istatus-float.sh focus #{pane_id}"
# R: return to the session active before the last switch-client (e.g. after
# jumping via the istatus popup to answer a notification elsewhere).
bind-key -T claude R switch-client -l

# Looking at a pane marks its finished hub dispatch viewed (only that; a decide
# notice or a blocking item still needs an answer). focus-events makes tmux
# report focus changes, which the hook needs. run-shell -b runs it in the
# background: the hook fires on every pane focus change, and nothing waits on
# its result, so focus switches shouldn't wait on a shell start.
set -g focus-events on
set-hook -g pane-focus-in 'run-shell -b "~/.workstation/claude/skills/istatus/scripts/istatus-hook.sh viewed #{pane_id}"'
