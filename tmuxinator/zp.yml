name: ZP
root: ~/workspace/zenpayroll

tmux_options: -2

attach: false

windows:
  - vim: vim
  - server:
      layout: main-vertical
      panes:
        - layout: even-vertical
          panes:
            - # zp server started by claude
            - cd ~/workspace/sea-turtle && ./gradlew run
        - claude "start the server"
  - db: bundle exec rails db
  - console: bundle exec rails c
  - shell:
      layout: main-vertical
      panes:
        -
        - claude
  # - sidekiq: bundle exec sidekiq
  # - webpack: bin/webpack-dev-server

